name: Publish packages to the Maven Central Repository

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v5
      # Release versions must match the GitHub tag. Manual runs leave the
      # version unchanged and are intended for publishing snapshots.
      - if: github.event_name == 'release'
        name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must be a Maven version such as '6.0.0' or '6.0.0-beta-1' (without a 'v' prefix)."
            exit 1
          fi
      - name: Set up Java and Maven
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - if: github.event_name == 'release'
        name: Set the release version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: mvn --batch-mode versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
      # These OSSRH-named variables contain the Maven Central Portal token.
      - name: Publish packages
        run: mvn --batch-mode --activate-profiles release deploy

env:
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
  OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
